version: "3.9"

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: agrovision_db
    environment:
      POSTGRES_DB: agrovision
      POSTGRES_USER: agrovision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - agrovision_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrovision -d agrovision"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: agrovision_backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATA_MODE: ${DATA_MODE:-mock}
      GEE_PROJECT: ${GEE_PROJECT}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - gee_credentials:/root/.config/earthengine
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  agrovision_pgdata:
  gee_credentials:
